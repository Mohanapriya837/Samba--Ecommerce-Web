spring.application.name=samba-book-platform
# Render/Railway inject PORT; SERVER_PORT is a manual override; 8080 is the local default.
server.port=${PORT:${SERVER_PORT:8080}}

# ---- MySQL (override with environment variables) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:samba_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mohana@123}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ---- JWT (secret must be at least 32 characters) ----
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-of-64-chars-minimum-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (React dev servers) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---- Default admin + sample data ----
app.admin.name=${ADMIN_NAME:Samba Admin}
app.admin.email=${ADMIN_EMAIL:admin@samba.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed.sample-data=${SEED_SAMPLE_DATA:true}

# ---- Misc ----
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
