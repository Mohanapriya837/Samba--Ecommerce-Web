# Activated by setting the environment variable SPRING_PROFILES_ACTIVE=prod
# (values here override the matching keys in application.properties)

# Don't leak stack traces or internal details to API clients
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# Keep logs quiet and query-free in production
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.root=INFO

# Sample catalogue is dev/demo convenience only — off by default in prod.
# Override with SEED_SAMPLE_DATA=true on a fresh prod database if you want it seeded once.
app.seed.sample-data=${SEED_SAMPLE_DATA:false}
